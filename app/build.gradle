plugins {
    id 'com.android.application'
}

android {
    namespace 'com.whispergroq'
    compileSdk 35

    defaultConfig {
        applicationId "com.whispergroq"
        minSdk 28
        targetSdk 35
        versionCode 10
        versionName "1.1.4"
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            def ksFile = System.getenv("KEYSTORE_FILE")
            if (ksFile != null) {
                def ks = new File(ksFile)
                if (!ks.isAbsolute()) ks = new File(rootDir, ksFile)
                if (ks.exists()) {
                    storeFile ks
                    keyAlias System.getenv("KEY_ALIAS") ?: "whispergroq"
                    keyPassword System.getenv("KEY_PASSWORD")
                    storePassword System.getenv("STORE_PASSWORD")
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // local debug builds remain unsigned or use default debug keystore
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.github.gkonovalov.android-vad:webrtc:2.0.10'
}
