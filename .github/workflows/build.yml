name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode keystore
        run: |
          echo "${{ secrets.WHISPERGROQ_KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/keystore.jks

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace --no-daemon
        env:
          KEYSTORE_FILE: keystore.jks
          KEY_ALIAS: whispergroq
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Rename APK with version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp app/build/outputs/apk/release/app-release.apk whispergroq-${VERSION}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: whispergroq-*.apk
          generate_release_notes: true
